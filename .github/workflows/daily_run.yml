name: Daily Run

on:
  schedule:
    # 23:30 UTC, Mon-Sat (after US market close) — adjust to match your HRP repo's schedule
    - cron: "30 23 * * 1-6"
  workflow_dispatch: {}

jobs:
  run-herc-allocator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run HERC allocator
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python trainer.py
